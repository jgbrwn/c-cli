<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <title>CineCLI Web</title>
  <meta name="color-scheme" content="dark light">
  <script>
    // Dark unless this browser chose light (toggle next to the title). Runs before paint.
    // A page that embeds this one can switch it too: see "Theme" in the README.
    (function () { var t = 'dark'; try { t = localStorage.getItem('c-cli-theme') || 'dark'; } catch (e) {} document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #e94560; margin-bottom: 20px; }
    h1 span { font-size: 0.5em; color: #888; }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    #sourceSelect {
      padding: 12px;
      font-size: 14px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #16213e;
      color: #fff;
      cursor: pointer;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #16213e;
      color: #fff;
      outline: none;
    }
    input[type="text"]:focus { border-color: #e94560; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #ff6b6b; }
    button:disabled { background: #555; cursor: not-allowed; }
    
    .loading { text-align: center; padding: 40px; color: #888; }
    .error { background: #ff4444; padding: 12px; border-radius: 8px; margin: 10px 0; }
    .success { background: #44aa44; padding: 12px; border-radius: 8px; margin: 10px 0; }
    
    .movies { display: grid; gap: 12px; }
    .movie {
      background: #16213e;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .movie:hover { background: #1f3460; }
    .movie-thumb {
      width: 45px;
      height: 67px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .movie-thumb-placeholder {
      width: 45px;
      height: 67px;
      background: #0f1729;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .movie-info { flex: 1; }
    .movie-info h3 { margin: 0 0 4px 0; color: #fff; font-size: 16px; }
    .movie-info span { color: #888; font-size: 14px; }
    .movie-rating { color: #ffd700; font-weight: bold; flex-shrink: 0; }
    .type-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }
    .type-tag.series { background: #3498db; color: white; }
    .type-tag.episode { background: #9b59b6; color: white; }
    /* Optional notes a proxy may add to API results (watchbox: "In library · 1080p", "Downloading now (42%)") */
    .lib-note { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-top: 4px; }
    .lib-note.have { background: #1e7a46; color: #fff; }
    .lib-note.downloading { background: #b7791f; color: #fff; }
    .lib-note.big { background: #a33b3b; color: #fff; }
    .box-note { flex-basis: 100%; order: 3; font-size: 13px; color: #f2b43c; }
    .lib-banner { margin: 12px 0; padding: 10px 14px; border-radius: 6px; font-weight: 600; }
    .lib-banner.have { background: rgba(30, 122, 70, 0.25); border: 1px solid #1e7a46; }
    .lib-banner.downloading { background: rgba(183, 121, 31, 0.25); border: 1px solid #b7791f; }
    
    .movie-details {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .movie-header {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }
    .movie-poster {
      width: 150px;
      border-radius: 8px;
      flex-shrink: 0;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .movie-poster:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
      cursor: pointer;
    }
    .movie-info-main { flex: 1; }
    .movie-details h2 { margin: 0 0 10px 0; color: #e94560; }
    .movie-meta { color: #888; margin-bottom: 10px; }
    .movie-meta span { margin-right: 15px; }
    .movie-genres { color: #4ecdc4; margin-bottom: 8px; }
    .movie-crew { color: #888; font-size: 14px; margin-bottom: 4px; }
    .movie-desc { line-height: 1.6; color: #ccc; }
    
    .torrents { margin-top: 20px; }
    .torrents h3 { color: #e94560; margin-bottom: 10px; }
    .torrent {
      background: #0f1729;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .torrent-info { display: flex; gap: 20px; flex-wrap: wrap; }
    .torrent-info span { color: #888; }
    .torrent-info .quality { color: #4ecdc4; font-weight: bold; }
    .torrent-info .seeds { color: #44aa44; }
    .torrent-info .peers { color: #ffaa00; }
    .torrent-actions { display: flex; gap: 8px; }
    .torrent-actions button { padding: 8px 12px; font-size: 14px; }
    .btn-magnet { background: #9b59b6; }
    .btn-magnet:hover { background: #a66bbe; }
    .btn-server { background: #3498db; }
    .btn-server:hover { background: #5dade2; }
    .btn-client { background: #27ae60; }
    .btn-client:hover { background: #2ecc71; }
    
    .back-btn {
      background: #555;
      margin-bottom: 15px;
    }
    .back-btn:hover { background: #666; }
    
    .magnet-display {
      background: #0f1729;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      color: #888;
    }
    .copy-btn {
      background: #555;
      padding: 6px 12px;
      font-size: 12px;
      margin-top: 8px;
    }
    
    /* Status messages */
    .status-msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .status-msg.loading {
      background: #2c3e50;
      color: #f39c12;
    }
    .status-msg.success {
      background: #1e4620;
      color: #4ade80;
    }
    .status-msg.error {
      background: #4a1515;
      color: #f87171;
    }
    
    /* Pagination styles */
    .pagination-info {
      color: #888;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 15px 0;
    }
    .page-btn {
      background: #3498db;
      padding: 10px 20px;
    }
    .page-btn:hover {
      background: #5dade2;
    }
    .page-numbers {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .page-num {
      background: #16213e;
      padding: 8px 14px;
      min-width: 40px;
      border: 1px solid #333;
    }
    .page-num:hover {
      background: #1f3460;
    }
    .page-num.active {
      background: #e94560;
      border-color: #e94560;
      cursor: default;
    }
    .page-ellipsis {
      color: #888;
      padding: 0 5px;
    }

    /* Theme toggle */
    h1 .theme-toggle { float: right; margin-top: 2px; }
    .theme-toggle { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; background: transparent; border: 1px solid #333; color: #888; border-radius: 8px; }
    .theme-toggle:hover { background: transparent; color: #eee; border-color: #888; }
    .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    html[data-theme="dark"] .theme-toggle .sun, html[data-theme="light"] .theme-toggle .moon { display: none; }

    /* Light theme: warm paper, amber accent (matches watchbox's light theme). */
    html[data-theme="light"] { color-scheme: light; --bg: #f5f3ef; --surface: #fff; --surface-2: #efece6; --line: #e2ded6; --text: #1c1b19; --muted: #6d6a63; --accent: #b7790f; --accent-hover: #9a660c; }
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="light"] body { background: var(--bg); color: var(--text); }
    html[data-theme="light"] h1, html[data-theme="light"] .movie-details h2, html[data-theme="light"] .torrents h3 { color: var(--accent); }
    html[data-theme="light"] h1 span, html[data-theme="light"] .loading, html[data-theme="light"] .movie-info span, html[data-theme="light"] .movie-meta,
    html[data-theme="light"] .movie-crew, html[data-theme="light"] .torrent-info span, html[data-theme="light"] .pagination-info,
    html[data-theme="light"] .page-ellipsis, html[data-theme="light"] .magnet-display { color: var(--muted); }
    html[data-theme="light"] #sourceSelect, html[data-theme="light"] input[type="text"] { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
    html[data-theme="light"] input[type="text"]:focus { border-color: var(--accent); }
    html[data-theme="light"] button { background: var(--accent); }
    html[data-theme="light"] button:hover { background: var(--accent-hover); }
    html[data-theme="light"] button:disabled { background: #c9c4bb; }
    html[data-theme="light"] .movie, html[data-theme="light"] .movie-details, html[data-theme="light"] .page-num { background: var(--surface); border: 1px solid var(--line); }
    html[data-theme="light"] .movie:hover, html[data-theme="light"] .page-num:hover { background: var(--surface-2); }
    html[data-theme="light"] .page-num { color: var(--text); }
    html[data-theme="light"] .movie-info .lib-note, html[data-theme="light"] .movie-info .type-tag { color: #fff; }
    html[data-theme="light"] .page-num.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    html[data-theme="light"] .movie-info h3 { color: var(--text); }
    html[data-theme="light"] .movie-thumb-placeholder, html[data-theme="light"] .torrent, html[data-theme="light"] .magnet-display { background: var(--surface-2); }
    html[data-theme="light"] .movie-desc { color: #3a3833; }
    html[data-theme="light"] .movie-rating { color: #a86a00; }
    html[data-theme="light"] .movie-genres, html[data-theme="light"] .torrent-info .quality { color: #0f766e; }
    html[data-theme="light"] .torrent-info .seeds { color: #1f8a4c; }
    html[data-theme="light"] .torrent-info .peers { color: #a86a00; }
    html[data-theme="light"] .movie-poster:hover { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18); }
    html[data-theme="light"] .back-btn, html[data-theme="light"] .copy-btn { background: transparent; color: var(--text); border: 1px solid var(--line); }
    html[data-theme="light"] .back-btn:hover, html[data-theme="light"] .copy-btn:hover { background: var(--surface-2); }
    html[data-theme="light"] .btn-magnet { background: #7e4fa0; } html[data-theme="light"] .btn-magnet:hover { background: #6b3f8a; }
    html[data-theme="light"] .btn-server, html[data-theme="light"] .page-btn { background: #2f6fb0; } html[data-theme="light"] .btn-server:hover, html[data-theme="light"] .page-btn:hover { background: #255a91; }
    html[data-theme="light"] .btn-client { background: #1f8a4c; } html[data-theme="light"] .btn-client:hover { background: #18703d; }
    html[data-theme="light"] .error { background: #fbe9e9; color: #c2383e; border: 1px solid #f0c4c6; }
    html[data-theme="light"] .success { background: #e6f4ec; color: #1f8a4c; border: 1px solid #bfe0cc; }
    html[data-theme="light"] .status-msg.loading { background: #fbf1dd; color: #a86a00; }
    html[data-theme="light"] .status-msg.success { background: #e6f4ec; color: #1f8a4c; }
    html[data-theme="light"] .status-msg.error { background: #fbe9e9; color: #c2383e; }
    html[data-theme="light"] .lib-banner.have { background: #e6f4ec; border-color: #1f8a4c; color: #17663a; }
    html[data-theme="light"] .lib-banner.downloading { background: #fbf1dd; border-color: #a86a00; color: #7a4d00; }
    html[data-theme="light"] .lib-note.have { background: #1f8a4c; } html[data-theme="light"] .lib-note.downloading { background: #a86a00; }
    html[data-theme="light"] .movie-info .lib-note.big { background: #c2383e; }
    html[data-theme="light"] .box-note { color: #a86a00; }
    html[data-theme="light"] .imdb-link { color: var(--accent) !important; }
    html[data-theme="light"] .theme-toggle { background: transparent; border-color: var(--line); color: var(--muted); }
    html[data-theme="light"] .theme-toggle:hover { color: var(--text); border-color: var(--muted); background: transparent; }

    /* Phones */
    @media (max-width: 640px) {
      body { padding: 12px; }
      h1 { font-size: 24px; margin: 4px 0 14px; }
      .search-box { flex-wrap: wrap; gap: 8px; }
      #sourceSelect { flex: 1 1 100%; }
      .search-box button { padding: 12px 16px; }
      .movie { padding: 10px; gap: 10px; }
      .movie-info h3 { font-size: 15px; }
      .movie-details { padding: 14px; }
      .movie-header { gap: 14px; }
      .movie-poster { width: 110px; }
      .movie-details h2 { font-size: 20px; }
      .movie-meta span { margin-right: 10px; white-space: nowrap; }
      .torrent { padding: 12px; }
      .torrent-info { gap: 12px; }
      .torrent-actions { width: 100%; }
      .torrent-actions button { flex: 1; padding: 10px 8px; }
      .pagination { flex-wrap: wrap; gap: 6px; }
      .page-btn { padding: 10px 14px; }
      .page-num { padding: 8px 10px; min-width: 36px; }
    }
    @media (max-width: 380px) {
      .movie-header { flex-direction: column; }
    }
    @media (hover: none) {
      .movie-poster:hover { transform: none; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 CineCLI <span>Web</span>
      <button type="button" id="themeToggle" class="theme-toggle" title="Switch between dark and light" aria-label="Switch between dark and light">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button></h1>
    
    <div class="search-box">
      <select id="sourceSelect">
        <option value="yts">YTS (Movies)</option>
        <option value="torrents-csv">Torrents-CSV (All)</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search for movies or TV shows, or paste an IMDb/TMDB link or id (tt…, tmdb:…)" autofocus>
      <button onclick="search()" id="searchBtn">Search</button>
    </div>
    
    <div id="content"></div>
  </div>

  <script>
    const content = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');

    // Theme: dark or light, remembered per browser.
    function setTheme(t) {
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      try { localStorage.setItem('c-cli-theme', document.documentElement.dataset.theme); } catch (e) {}
    }
    document.getElementById('themeToggle').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
    
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') search();
    });

    // Opened with ?q=… (and &source=yts|torrents-csv), e.g. from a link elsewhere: search right away.
    try {
      const qs = new URLSearchParams(location.search);
      if (qs.get('source') === 'yts' || qs.get('source') === 'torrents-csv') document.getElementById('sourceSelect').value = qs.get('source');
      if (qs.get('q')) { searchInput.value = qs.get('q'); setTimeout(() => search(), 0); }
    } catch (e) {}
    
    // Global state for pagination
    let currentPage = 1;
    let currentQuery = '';
    let currentSource = 'yts';
    
    // Set by the detail views when the result carries a library_note (added by a proxy such as watchbox).
    let libraryNote = null;
    const libState = o => (o && o.library_state === 'downloading') ? 'downloading' : 'have';
    function libBadge(o) {
      return o && o.library_note ? `<div><span class="lib-note ${libState(o)}">${o.library_state === 'downloading' ? '⬇' : '✓'} ${escapeHtml(o.library_note)}</span></div>` : '';
    }
    function libBanner(o) {
      return o && o.library_note ? `<div class="lib-banner ${libState(o)}">${o.library_state === 'downloading' ? '⬇' : '✓'} ${escapeHtml(o.library_note)}</div>` : '';
    }
    // box_note: a proxy's note that a torrent doesn't fit where "⬇ Server" downloads go (watchbox: free space on the box).
    let torrentNotes = [];        // per torrent on the details page
    const searchBoxNotes = {};    // Torrents-CSV results, by info hash
    function boxNote(note) {
      return note ? `<div class="box-note">⚠ ${escapeHtml(note)}</div>` : '';
    }
    // toServer: the download goes to the server (box notes apply), not to this computer.
    function okToDownload(idx, toServer) {
      const notes = [libraryNote, toServer ? torrentNotes[idx || 0] : null].filter(Boolean);
      return !notes.length || confirm(notes.map(n => n.replace(/\.$/, '')).join('.\n\n') + '.\n\nDownload anyway?');
    }

    async function search(page = 1) {
      libraryNote = null;
      const query = searchInput.value.trim();
      if (!query) return;
      
      currentQuery = query;
      currentSource = document.getElementById('sourceSelect').value;
      currentPage = page;
      
      content.innerHTML = '<div class="loading">Searching...</div>';
      
      try {
        const resp = await fetch(`/api/search?q=${encodeURIComponent(query)}&source=${currentSource}&page=${page}&per_page=20`);
        const data = await resp.json();
        
        if (!resp.ok) {
          content.innerHTML = `<div class="error">${data?.error || 'Search failed'}</div>`;
          return;
        }
        
        // Handle paginated response
        const results = data.results || data;
        const pagination = data.total ? data : null;
        
        // Searched by an IMDb/TMDB id: say which title it is.
        const lk = data.lookup;
        const lookupHtml = lk ? `<div class="pagination-info id-lookup">Results for <b>${escapeHtml(lk.title)}</b>${lk.year ? ' (' + escapeHtml(lk.year) + ')' : ''}${lk.type === 'series' ? ' · show' : ''}${lk.imdb_id ? ' · ' + escapeHtml(lk.imdb_id) : ''}${lk.tmdb_id ? ' · TMDB ' + lk.tmdb_id : ''}</div>` : '';

        if (!results || results.length === 0) {
          content.innerHTML = lookupHtml + `<div class="error">${escapeHtml(data.note || 'No results found')}</div>`;
          return;
        }
        
        let html = lookupHtml;
        
        // Pagination header
        if (pagination) {
          html += `<div class="pagination-info">Showing ${(pagination.page - 1) * pagination.per_page + 1}-${Math.min(pagination.page * pagination.per_page, pagination.total)} of ${pagination.total} results</div>`;
        }
        
        html += '<div class="movies">';
        
        if (currentSource === 'yts') {
          html += results.map(m => `
            <div class="movie" onclick="showMovie(${m.id})">
              ${m.small_cover_image ? `<img class="movie-thumb" src="${m.small_cover_image}" alt="">` : '<div class="movie-thumb-placeholder">🎬</div>'}
              <div class="movie-info">
                <h3>${escapeHtml(m.title)}</h3>
                <span>${m.year || ''}${m.runtime ? ` • ${m.runtime} min` : ''}</span>
                ${libBadge(m)}
              </div>
              ${m.rating ? `<div class="movie-rating">⭐ ${m.rating}</div>` : ''}
            </div>
          `).join('');
        } else {
          // Torrents-CSV format
          html += results.map(m => {
            searchBoxNotes[m.id] = m.box_note || null;
            const isSeries = m.omdb?.Type === 'series';
            const isEpisode = m.omdb?.Type === 'episode';
            const isTVContent = isSeries || isEpisode;
            const placeholder = isTVContent ? '📺' : '🎬';
            const typeTag = isSeries ? '<span class="type-tag series">📺 Series</span>' : (isEpisode ? '<span class="type-tag episode">📺 Episode</span>' : '');
            return `
            <div class="movie" onclick="showTorrent('${m.id}', '${escapeJs(m.title)}', '${m.size}', ${m.seeders || 0}, ${m.leechers || 0}, '${m.imdb_code || ''}')">
              ${m.omdb?.Poster && m.omdb.Poster !== 'N/A' ? `<img class="movie-thumb" src="${m.omdb.Poster}" alt="">` : `<div class="movie-thumb-placeholder">${placeholder}</div>`}
              <div class="movie-info">
                <h3>${escapeHtml(m.title)} ${typeTag}</h3>
                <span>${m.year || ''} • ${m.size} • ⬆${m.seeders || 0} ⬇${m.leechers || 0}${m.omdb?.totalSeasons ? ` • ${m.omdb.totalSeasons} seasons` : ''}</span>
                ${libBadge(m)}
                ${m.box_note ? '<div><span class="lib-note big">⚠ Bigger than the free space</span></div>' : ''}
              </div>
              ${m.omdb?.imdbRating && m.omdb.imdbRating !== 'N/A' ? `<div class="movie-rating">⭐ ${m.omdb.imdbRating}</div>` : ''}
            </div>
          `}).join('');
        }
        
        html += '</div>';
        
        // Pagination controls
        if (pagination && pagination.total_pages > 1) {
          html += '<div class="pagination">';
          
          // Previous button
          if (pagination.page > 1) {
            html += `<button onclick="search(${pagination.page - 1})" class="page-btn">← Previous</button>`;
          }
          
          // Page numbers
          html += '<span class="page-numbers">';
          const startPage = Math.max(1, pagination.page - 2);
          const endPage = Math.min(pagination.total_pages, pagination.page + 2);
          
          if (startPage > 1) {
            html += `<button onclick="search(1)" class="page-num">1</button>`;
            if (startPage > 2) html += '<span class="page-ellipsis">...</span>';
          }
          
          for (let i = startPage; i <= endPage; i++) {
            if (i === pagination.page) {
              html += `<button class="page-num active">${i}</button>`;
            } else {
              html += `<button onclick="search(${i})" class="page-num">${i}</button>`;
            }
          }
          
          if (endPage < pagination.total_pages) {
            if (endPage < pagination.total_pages - 1) html += '<span class="page-ellipsis">...</span>';
            html += `<button onclick="search(${pagination.total_pages})" class="page-num">${pagination.total_pages}</button>`;
          }
          html += '</span>';
          
          // Next button
          if (pagination.page < pagination.total_pages) {
            html += `<button onclick="search(${pagination.page + 1})" class="page-btn">Next →</button>`;
          }
          
          html += '</div>';
        }
        
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
    
    async function showMovie(id) {
      content.innerHTML = '<div class="loading">Loading movie details...</div>';
      
      try {
        const resp = await fetch(`/api/movie/${id}`);
        const movie = await resp.json();
        
        if (movie.error) {
          content.innerHTML = `<div class="error">${movie.error}</div>`;
          return;
        }
        
        const omdb = movie.omdb;
        libraryNote = movie.library_note || null;
        const genres = omdb?.Genre || ((movie.genres && movie.genres.length) ? movie.genres.join(', ') : null);
        const desc = omdb?.Plot || movie.summary || movie.description_full || 'No description available.';
        const rating = omdb?.imdbRating || movie.rating || null;
        const runtime = omdb?.Runtime?.replace(' min', '') || movie.runtime || null;
        const director = omdb?.Director || null;
        const actors = omdb?.Actors || null;
        const poster = (omdb?.Poster && omdb.Poster !== 'N/A') ? omdb.Poster : (movie.large_cover_image || movie.medium_cover_image || null);
        const rated = omdb?.Rated && omdb.Rated !== 'N/A' ? omdb.Rated : null;
        
        let torrentsHtml = '';
        torrentNotes = (movie.torrents || []).map(t => t.box_note || null);
        if (movie.torrents && movie.torrents.length > 0) {
          torrentsHtml = `
            <div class="torrents">
              <h3>🧲 Available Torrents</h3>
              ${movie.torrents.map((t, i) => `
                <div class="torrent" id="torrent-${i}">
                  <div class="torrent-info">
                    <span class="quality">${t.quality}</span>
                    <span>${t.size}</span>
                    <span class="seeds">⬆ ${t.seeds} seeds</span>
                    <span class="peers">⬇ ${t.peers} peers</span>
                  </div>
                  ${boxNote(t.box_note)}
                  <div class="torrent-actions">
                    <button class="btn-magnet" onclick="showMagnet('${t.hash}', '${escapeJs(movie.title)} ${t.quality}', ${i})">Magnet</button>
                    <button class="btn-server" onclick="downloadToServer('${escapeJs(t.url)}', '${escapeJs(movie.title)}', '${t.quality}', ${i})">⬇ Server</button>
                    <button class="btn-client" onclick="downloadToClient('${escapeJs(t.url)}', '${escapeJs(movie.title)}', '${t.quality}')">💾 Save</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
        
        content.innerHTML = `
          <button class="back-btn" onclick="search()">← Back to results</button>
          <div class="movie-details">
            <div class="movie-header">
              ${poster ? `<a href="https://www.imdb.com/title/${movie.imdb_code}" target="_blank" rel="noopener" title="View on IMDB"><img class="movie-poster" src="${poster}" alt="${escapeHtml(movie.title)}"></a>` : ''}
              <div class="movie-info-main">
                <h2>${escapeHtml(movie.title)} (${movie.year})</h2>
                <div class="movie-meta">
                  ${rating ? `<span>⭐ ${rating}</span>` : ''}
                  ${runtime ? `<span>⏱ ${runtime} min</span>` : ''}
                  ${rated ? `<span>🎫 ${rated}</span>` : ''}
                </div>
                ${genres ? `<div class="movie-genres">🎭 ${genres}</div>` : ''}
                ${director ? `<div class="movie-crew">🎬 Director: ${escapeHtml(director)}</div>` : ''}
                ${actors ? `<div class="movie-crew">🎭 Cast: ${escapeHtml(actors)}</div>` : ''}
              </div>
            </div>
            <div class="movie-desc">${escapeHtml(desc)}</div>
            ${libBanner(movie)}
            ${torrentsHtml}
          </div>
        `;
      } catch (err) {
        content.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
    
    async function showMagnet(hash, name, idx) {
      try {
        const resp = await fetch(`/api/magnet?hash=${hash}&name=${encodeURIComponent(name)}`);
        const data = await resp.json();
        
        const container = document.getElementById(`torrent-${idx}`);
        // Remove any existing magnet display
        const existing = container.querySelector('.magnet-display');
        if (existing) existing.remove();
        
        const magnetDiv = document.createElement('div');
        magnetDiv.className = 'magnet-display';
        magnetDiv.innerHTML = `
          ${data.magnet}
          <br><button class="copy-btn" onclick="copyMagnet(this, '${escapeJs(data.magnet)}')">Copy to clipboard</button>
        `;
        container.appendChild(magnetDiv);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
    
    function copyMagnet(btn, magnet) {
      navigator.clipboard.writeText(magnet).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy to clipboard', 2000);
      });
    }
    
    async function downloadToServer(url, title, quality, idx) {
      if (!okToDownload(idx, true)) return;
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Saving...';
      
      try {
        const resp = await fetch(`/api/download?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}&quality=${quality}`);
        const data = await resp.json();
        
        if (data.error) {
          alert('Error: ' + data.error);
          btn.textContent = '⬇ Server';
          btn.disabled = false;
          return;
        }
        
        btn.textContent = '✓ Saved';
        btn.style.background = '#44aa44';
        
        // Show success message
        const container = document.getElementById(`torrent-${idx}`);
        const existing = container.querySelector('.success');
        if (existing) existing.remove();
        
        const successDiv = document.createElement('div');
        successDiv.className = 'success';
        successDiv.textContent = `Saved to server: ${data.filepath}`;
        container.appendChild(successDiv);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.textContent = '⬇ Server';
        btn.disabled = false;
      }
    }
    
    function downloadToClient(url, title, quality) {
      if (!okToDownload()) return;
      const link = document.createElement('a');
      link.href = `/api/download-file?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}&quality=${quality}`;
      link.download = '';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    
    async function downloadTorrentToClient(infohash, title) {
      if (!okToDownload()) return;
      const btn = event.target;
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Fetching...';
      
      const container = document.getElementById('torrent-0');
      
      // Remove any existing status messages
      const existingStatus = container?.querySelector('.status-msg');
      if (existingStatus) existingStatus.remove();
      
      // Show loading status
      let statusDiv = null;
      if (container) {
        statusDiv = document.createElement('div');
        statusDiv.className = 'status-msg loading';
        statusDiv.innerHTML = '⏳ Fetching .torrent from cache services...';
        container.appendChild(statusDiv);
      }
      
      try {
        const resp = await fetch(`/api/download-torrent?infohash=${encodeURIComponent(infohash)}&title=${encodeURIComponent(title)}`);
        
        if (!resp.ok) {
          throw new Error('Failed to fetch torrent');
        }
        
        // Get filename from Content-Disposition header
        const disposition = resp.headers.get('Content-Disposition');
        let filename = `${title.replace(/[^a-zA-Z0-9]/g, '_')}.torrent`;
        if (disposition) {
          const match = disposition.match(/filename="(.+)"/);
          if (match) filename = match[1];
        }
        
        // Determine file type from Content-Type
        const contentType = resp.headers.get('Content-Type');
        const isTorrent = contentType?.includes('bittorrent');
        
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        btn.textContent = '✓ Saved';
        btn.style.background = '#44aa44';
        
        if (statusDiv) {
          const fileType = isTorrent ? '.torrent file' : '.magnet file (cache unavailable)';
          statusDiv.className = 'status-msg success';
          statusDiv.textContent = `✓ Downloaded ${fileType}`;
        }
      } catch (err) {
        if (statusDiv) {
          statusDiv.className = 'status-msg error';
          statusDiv.textContent = `Error: ${err.message}`;
        }
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
    
    function escapeJs(text) {
      return (text || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
    
    async function showTorrent(infohash, title, size, seeders, leechers, imdbCode) {
      content.innerHTML = '<div class="loading">Loading details...</div>';
      
      // Fetch OMDB data
      let omdb = null;
      try {
        let omdbUrl = imdbCode 
          ? `/api/omdb?i=${encodeURIComponent(imdbCode)}`
          : `/api/omdb?t=${encodeURIComponent(title)}`;
        const resp = await fetch(omdbUrl);
        const data = await resp.json();
        if (data && data.Title) {
          omdb = data;
          if (!imdbCode && data.imdbID) {
            imdbCode = data.imdbID;
          }
        }
      } catch (e) {
        console.log('OMDB lookup failed:', e);
      }
      
      libraryNote = omdb?.library_note || null;
      torrentNotes = [searchBoxNotes[infohash] || null];

      // Determine if it's a TV show
      const isSeries = omdb?.Type === 'series';
      const isEpisode = omdb?.Type === 'episode';
      const isTVContent = isSeries || isEpisode;
      
      // Build metadata display
      const rating = omdb?.imdbRating && omdb.imdbRating !== 'N/A' ? omdb.imdbRating : null;
      const runtime = omdb?.Runtime && omdb.Runtime !== 'N/A' ? omdb.Runtime : null;
      const rated = omdb?.Rated && omdb.Rated !== 'N/A' ? omdb.Rated : null;
      const genres = omdb?.Genre && omdb.Genre !== 'N/A' ? omdb.Genre : null;
      const year = omdb?.Year || null;
      const totalSeasons = omdb?.totalSeasons || null;
      const director = omdb?.Director && omdb.Director !== 'N/A' ? omdb.Director : null;
      const writer = omdb?.Writer && omdb.Writer !== 'N/A' ? omdb.Writer : null;
      const actors = omdb?.Actors && omdb.Actors !== 'N/A' ? omdb.Actors : null;
      const plot = omdb?.Plot && omdb.Plot !== 'N/A' ? omdb.Plot : null;
      const poster = omdb?.Poster && omdb.Poster !== 'N/A' ? omdb.Poster : null;
      
      // Type badge
      const typeBadge = isSeries ? '📺 TV Series' : (isEpisode ? '📺 Episode' : '🎬 Movie');
      
      content.innerHTML = `
        <button class="back-btn" onclick="search()">← Back to results</button>
        <div class="movie-details">
          <div class="movie-header">
            ${poster ? `<a href="https://www.imdb.com/title/${imdbCode}" target="_blank" rel="noopener" title="View on IMDB"><img class="movie-poster" src="${poster}" alt="${escapeHtml(omdb?.Title || title)}"></a>` : ''}
            <div class="movie-info-main">
              <h2>${escapeHtml(omdb?.Title || title)}${year ? ` (${year})` : ''}</h2>
              <div class="movie-meta">
                <span>${typeBadge}</span>
                ${rating ? `<span>⭐ ${rating}</span>` : ''}
                ${runtime ? `<span>⏱ ${runtime}</span>` : ''}
                ${rated ? `<span>🎫 ${rated}</span>` : ''}
                ${totalSeasons ? `<span>📅 ${totalSeasons} seasons</span>` : ''}
              </div>
              ${genres ? `<div class="movie-genres">🎭 ${genres}</div>` : ''}
              ${isTVContent && writer ? `<div class="movie-crew">✍️ Creator: ${escapeHtml(writer)}</div>` : ''}
              ${!isTVContent && director ? `<div class="movie-crew">🎬 Director: ${escapeHtml(director)}</div>` : ''}
              ${actors ? `<div class="movie-crew">🎭 Cast: ${escapeHtml(actors)}</div>` : ''}
              ${imdbCode ? `<div class="movie-crew"><a href="https://www.imdb.com/title/${imdbCode}" target="_blank" class="imdb-link" style="color: #e94560;">🔗 View on IMDB</a></div>` : ''}
            </div>
          </div>
          ${plot ? `<div class="movie-desc">${escapeHtml(plot)}</div>` : ''}
          ${libBanner(omdb)}
          <div class="torrents">
            <h3>🧲 Download Options</h3>
            <div class="torrent" id="torrent-0">
              <div class="torrent-info">
                <span class="quality">Full</span>
                <span>💾 ${size}</span>
                <span class="seeds">⬆ ${seeders}</span>
                <span class="peers">⬇ ${leechers}</span>
              </div>
              ${boxNote(torrentNotes[0])}
              <div class="torrent-actions">
                <button class="btn-magnet" onclick="showMagnetDirect('${infohash}', '${escapeJs(title)}', 0)">Magnet</button>
                <button class="btn-server" onclick="downloadToServerDirect('${infohash}', '${escapeJs(title)}', 0)">⬇ Server</button>
                <button class="btn-client" onclick="downloadTorrentToClient('${infohash}', '${escapeJs(title)}')">💾 Save</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }
    
    function showMagnetDirect(infohash, title, idx) {
      const magnet = `magnet:?xt=urn:btih:${infohash}&dn=${encodeURIComponent(title)}&tr=udp://open.demonii.com:1337/announce&tr=udp://tracker.openbittorrent.com:80/announce&tr=udp://tracker.opentrackr.org:1337/announce`;
      
      const container = document.getElementById(`torrent-${idx}`);
      const existing = container.querySelector('.magnet-display');
      if (existing) existing.remove();
      
      const magnetDiv = document.createElement('div');
      magnetDiv.className = 'magnet-display';
      magnetDiv.innerHTML = `
        ${magnet}
        <br><button class="copy-btn" onclick="copyMagnet(this, '${magnet.replace(/'/g, "\\'")}')">Copy to clipboard</button>
      `;
      container.appendChild(magnetDiv);
    }
    
    async function downloadToServerDirect(infohash, title, idx) {
      if (!okToDownload(idx, true)) return;
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Saving...';
      
      const container = document.getElementById(`torrent-${idx}`);
      
      // Remove any existing status messages
      const existingStatus = container.querySelector('.status-msg');
      if (existingStatus) existingStatus.remove();
      
      // Show loading status
      const statusDiv = document.createElement('div');
      statusDiv.className = 'status-msg loading';
      statusDiv.innerHTML = '⏳ Fetching .torrent from cache services...';
      container.appendChild(statusDiv);
      
      try {
        const resp = await fetch(`/api/save-magnet?infohash=${infohash}&title=${encodeURIComponent(title)}`);
        const data = await resp.json();
        
        if (data.error) {
          statusDiv.className = 'status-msg error';
          statusDiv.textContent = `Error: ${data.error}`;
          btn.textContent = '⬇ Server';
          btn.disabled = false;
          return;
        }
        
        btn.textContent = '✓ Saved';
        btn.style.background = '#44aa44';
        
        // Show success with file type info
        const fileType = data.type === 'torrent' ? '.torrent file' : '.magnet file (cache unavailable)';
        statusDiv.className = 'status-msg success';
        statusDiv.textContent = `✓ Saved ${fileType}: ${data.filepath}`;
      } catch (err) {
        statusDiv.className = 'status-msg error';
        statusDiv.textContent = `Error: ${err.message}`;
        btn.textContent = '⬇ Server';
        btn.disabled = false;
      }
    }
  </script>
